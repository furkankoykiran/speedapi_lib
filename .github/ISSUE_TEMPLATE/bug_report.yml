name: Bug Report
description: Report a reproducible bug or unexpected behaviour
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - furkankoykiran

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet that reproduces the issue.
      render: python
      placeholder: |
        from speedapi import SpeedAPI

        client = SpeedAPI(api_key="sk_test_...")
        # ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: Include the full traceback if applicable.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: speedapi-python Version
      placeholder: "e.g. 2.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g. 3.11.8"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am using a supported version (2.x)
          required: true
