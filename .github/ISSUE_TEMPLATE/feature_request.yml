name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - furkankoykiran

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe it clearly so we can evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? What use-case does it enable?
      placeholder: "I'm trying to do X but the SDK doesn't support..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the API / interface you'd like to see.
      render: python
      placeholder: |
        # Example of ideal usage
        client.some_new_resource.some_new_method(...)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've thought of?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a bug report (use the Bug Report template for that)
          required: true
