name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # matches v2.0.0, v2.1.0, v2.0.1 …

permissions:
  contents: write          # needed to create GitHub Release
  id-token: write          # needed for PyPI Trusted Publisher (OIDC)

jobs:
  # ── 1. Full test gate ──────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── 2. Lint + type check gate ──────────────────────────────────────────────
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "ruff>=0.4" "mypy>=1.10" -e ".[dev]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: mypy
        run: mypy src/speedapi --ignore-missing-imports

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, quality]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & twine
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 4. Publish to PyPI & GitHub Release ──────────────────────────────────
  publish:
    name: Publish & Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/speedapi-lib/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/* \
            --title "speedapi-python ${TAG}" \
            --generate-notes \
            --verify-tag
